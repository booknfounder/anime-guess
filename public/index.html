<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<title>خمن شخصية الأنمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<button id="muteBtn" class="mute" title="كتم الصوت" aria-label="كتم الصوت">🔊</button>
<div id="toast"></div>
<div id="floaters"></div>

<main>
  <!-- الشاشة الرئيسية -->
  <section id="home" class="screen active">
    <div class="glass home-card">
      <h1 class="logo">خمن شخصية الأنمي</h1>
      <p class="muted center">تحدَّ أصدقاءك وخمّن الشخصية قبل الجميع ⚡</p>
      <label for="nameInput">اسمك</label>
      <input id="nameInput" maxlength="16" placeholder="اكتب اسمك..." autocomplete="off">
      <label>اختر أفتارك</label>
      <div id="avatarGrid" class="avatars"><span class="muted">جارٍ تحميل الأفتارات من AniList...</span></div>
      <button id="createBtn" class="btn primary">✨ إنشاء غرفة</button>
      <div class="or">أو انضم بكود</div>
      <div class="row">
        <input id="codeInput" maxlength="5" placeholder="كود الغرفة" dir="ltr" autocomplete="off">
        <button id="joinBtn" class="btn">انضمام</button>
      </div>
    </div>
  </section>

  <!-- واجهة الغرفة -->
  <div id="room" class="room hidden">
    <div class="mainCol">
      <section id="lobby" class="screen">
        <div class="glass">
          <div class="codeRow">
            <div><small class="muted">كود الغرفة</small><div id="roomCode" class="code" dir="ltr"></div></div>
            <div class="row">
              <button id="copyCode" class="btn sm">نسخ الكود</button>
              <button id="copyLink" class="btn sm">نسخ رابط الدعوة</button>
            </div>
          </div>
        </div>
        <div class="glass">
          <h3>⚙️ إعدادات اللعبة</h3>
          <div id="settings"></div>
          <button id="startBtn" class="btn primary hidden">🚀 ابدأ اللعبة</button>
          <p id="waitMsg" class="muted center"></p>
        </div>
      </section>

      <section id="game" class="screen">
        <div class="glass">
          <div class="topbar">
            <span id="roundLbl" class="chip"></span>
            <span id="hintChip" class="chip hint hidden"></span>
            <span id="timeLbl" class="time"></span>
          </div>
          <div class="bar"><div id="barFill"></div></div>
          <div id="play">
            <div class="pic"><img id="charImg" referrerpolicy="no-referrer" alt="شخصية"></div>
            <div id="options" class="options"></div>
            <form id="typeForm" class="row hidden">
              <input id="typeInput" dir="auto" autocomplete="off" placeholder="اكتب اسم الشخصية بالإنجليزية...">
              <button class="btn primary">إرسال</button>
            </form>
            <div id="status" class="status"></div>
          </div>
          <div id="reveal" class="hidden"></div>
        </div>
      </section>

      <section id="end" class="screen"><div class="glass" id="endBox"></div></section>
    </div>

    <aside class="side">
      <div class="glass"><h3>👥 اللاعبون</h3><ul id="players" class="plist"></ul></div>
      <div class="glass chat">
        <h3>💬 الشات</h3>
        <div id="msgs" class="msgs"></div>
        <div class="reacts">
          <button data-e="🔥">🔥</button><button data-e="😂">😂</button><button data-e="😱">😱</button>
          <button data-e="GG">GG</button><button data-e="👏">👏</button><button data-e="❤️">❤️</button>
        </div>
        <form id="chatForm" class="row">
          <input id="chatInput" maxlength="140" placeholder="اكتب رسالة..." autocomplete="off">
          <button class="btn sm">إرسال</button>
        </form>
      </div>
    </aside>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
